[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uniqueizer"
version = "0.1.0"
description = "Core PIL image uniqueization pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "build",
    "twine",
]
